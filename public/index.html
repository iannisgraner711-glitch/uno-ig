<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Private Card Game</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #181818; color: #fff; margin: 0; padding: 10px; overflow-x: hidden; }
    input, button { padding: 12px; margin: 6px; font-size: 16px; border-radius: 8px; border: none; }
    button { background-color: #28a745; color: white; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }

    /* CARD STYLING */
    .card {
      width: 80px;
      height: 120px;
      border-radius: 10px;
      border: 3px solid #fff;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      display: inline-block;
      user-select: none;
      box-sizing: border-box;
    }
    .card .corner { position: absolute; top: 5px; left: 6px; font-size: 14px; font-weight: bold; }
    .card .center-oval {
      width: 55px;
      height: 80px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .center-number { font-size: 32px; font-weight: 900; }

    /* CARD COLORS */
    .Red { background-color: #e74c3c; color: white; }
    .Red .center-number { color: #e74c3c; }
    
    .Blue { background-color: #2980b9; color: white; }
    .Blue .center-number { color: #2980b9; }
    
    .Green { background-color: #27ae60; color: white; }
    .Green .center-number { color: #27ae60; }
    
    .Yellow { background-color: #f1c40f; color: black; }
    .Yellow .center-number { color: #f1c40f; }

    /* OVERLAPPING HAND */
    .hand-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      padding-left: 40px;
      overflow-x: auto;
      padding-bottom: 20px;
    }
    .hand-container .card {
      margin-left: -45px; /* Creates card overlap */
      transition: transform 0.2s;
    }
    .hand-container .card:hover, .hand-container .card:active {
      transform: translateY(-20px);
      z-index: 100 !important;
    }

    /* LEADERBOARD & GAME LAYOUT */
    .leaderboard { background: #282828; padding: 10px; border-radius: 8px; margin: 10px auto; max-width: 300px; text-align: left; }
    .leaderboard ol { margin: 5px 0; padding-left: 20px; }
  </style>
</head>
<body>

  <!-- JOIN SCREEN -->
  <div id="loginScreen">
    <h1>Enter Game Passcode</h1>
    <input type="text" id="username" placeholder="Your Name" /><br>
    <input type="text" id="roomCode" placeholder="Room Code (e.g. 1234)" /><br>
    <button onclick="join()">Join Lobby</button>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" class="hidden">
    <h2 id="roomTitle"></h2>
    <h3>Players in Lobby (Max 12):</h3>
    <ul id="playerList" style="list-style:none; padding:0;"></ul>
    <button onclick="startGame()" style="background-color: #007bff;">Start Game</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <h2 id="turnDisplay">Waiting...</h2>
    
    <div id="leaderboardBox" class="leaderboard hidden">
      <strong>🏆 Finishers Leaderboard:</strong>
      <ol id="leaderboardList"></ol>
    </div>

    <div>
      <p>Discard Pile:</p>
      <div id="topCard"></div>
    </div>
    
    <br>
    <button onclick="drawCard()" style="background-color: #e67e22;">Draw Card</button>

    <h3>Your Hand:</h3>
    <div id="hand" class="hand-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function join() {
      const username = document.getElementById('username').value;
      const roomCode = document.getElementById('roomCode').value;

      if (username && roomCode) {
        socket.emit('joinRoom', { username, roomCode });
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');
        document.getElementById('roomTitle').innerText = "Room Code: " + roomCode;
      }
    }

    function startGame() { socket.emit('startGame'); }
    function playCard(cardId) { socket.emit('playCard', cardId); }
    function drawCard() { socket.emit('drawCard'); }

    socket.on('errorMsg', (msg) => { alert(msg); location.reload(); });

    socket.on('updateLobby', (players) => {
      const list = document.getElementById('playerList');
      list.innerHTML = players.map(p => `<li>🎮 ${p.name}</li>`).join('');
    });

    // Helper function to render a styled card
    function renderCardHtml(card, index = 0, onClickFn = '') {
      return `
        <div class="card ${card.color}" style="z-index: ${index};" onclick="${onClickFn}">
          <div class="corner">${card.value}</div>
          <div class="center-oval">
            <span class="center-number">${card.value}</span>
          </div>
        </div>
      `;
    }

    socket.on('gameState', (data) => {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      document.getElementById('turnDisplay').innerText = "Turn: " + data.currentTurn;
      document.getElementById('topCard').innerHTML = renderCardHtml(data.topCard);

      // Render Leaderboard
      if (data.leaderboard && data.leaderboard.length > 0) {
        document.getElementById('leaderboardBox').classList.remove('hidden');
        const lbList = document.getElementById('leaderboardList');
        lbList.innerHTML = data.leaderboard.map(name => `<li>${name}</li>`).join('');
      }
    });

    socket.on('yourHand', (cards) => {
      const handDiv = document.getElementById('hand');
      handDiv.innerHTML = cards.map((c, idx) => 
        renderCardHtml(c, idx, `playCard('${c.id}')`)
      ).join('');
    });

    socket.on('gameOver', (finalLeaderboard) => {
      alert("🎉 Game Over!\n\nFinal Rankings:\n" + finalLeaderboard.map((name, i) => `${i + 1}. ${name}`).join('\n'));
      location.reload();
    });
  </script>
</body>
</html>
