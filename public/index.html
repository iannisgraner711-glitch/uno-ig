<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Private Card Game Deluxe</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-w: clamp(55px, 12vw, 80px);
      --card-h: calc(var(--card-w) * 1.46);
    }
    body.theme-wood { --bg-color: #2e1d0c; --panel-bg: #422b15; }
    body.theme-neon { --bg-color: #0d0221; --panel-bg: #190933; }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .game-title { font-size: clamp(14px, 3.5vw, 20px); font-weight: bold; margin: 0; }
    .theme-picker {
      padding: 6px 10px;
      font-size: clamp(12px, 2.8vw, 14px);
      border-radius: 6px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
    }

    input, button, select { padding: clamp(8px, 2vw, 12px); margin: 4px; font-size: clamp(13px, 3vw, 16px); border-radius: 8px; border: none; outline: none; }
    button { background-color: #28a745; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    button:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }

    .hidden { display: none !important; }

    .turn-bar { font-size: clamp(14px, 3.5vw, 18px); font-weight: bold; margin: 4px 0; }
    .timer-container { width: min(85%, 400px); background: #333; height: clamp(6px, 1.5vh, 10px); border-radius: 5px; margin: 4px auto 10px auto; overflow: hidden; }
    .timer-fill { width: 100%; height: 100%; background: #e74c3c; transition: width 1s linear; }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: clamp(5px, 1.2vw, 10px);
      border: clamp(2px, 0.4vw, 3px) solid #fff;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      display: inline-block;
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.2s ease;
      transform-origin: bottom center;
    }
    .card:hover { transform: translateY(-20px) scale(1.15) !important; z-index: 100 !important; }
    .card .corner { position: absolute; top: 2px; left: 4px; font-size: clamp(9px, 2vw, 12px); font-weight: bold; }
    .card .center-oval {
      width: 65%;
      height: 65%;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-15deg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card .center-number { font-size: clamp(14px, 3.5vw, 22px); font-weight: 900; }

    .Red { background-color: #e74c3c; color: white; }
    .Red .center-number { color: #e74c3c; }
    .Blue { background-color: #2980b9; color: white; }
    .Blue .center-number { color: #2980b9; }
    .Green { background-color: #27ae60; color: white; }
    .Green .center-number { color: #27ae60; }
    .Yellow { background-color: #f1c40f; color: black; }
    .Yellow .center-number { color: #f1c40f; }
    .Wild { background: linear-gradient(135deg, #e74c3c, #2980b9, #27ae60, #f1c40f); color: white; }
    .Wild .center-number { color: #111; }

    .pile-area { position: relative; width: clamp(100px, 25vw, 140px); height: clamp(100px, 25vw, 140px); margin: 6px auto; display: flex; align-items: center; justify-content: center; }
    .pile-area .card { position: absolute; }
    .direction-arrow { position: absolute; width: 100%; height: 100%; border: 3px dashed #f1c40f; border-radius: 50%; pointer-events: none; transition: transform 0.5s ease; }
    .direction-arrow.reverse { transform: rotate(-180deg); border-color: #e74c3c; }

    .hand-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 15px auto 10px auto;
      min-height: calc(var(--card-h) + 35px);
      width: 100%;
      max-width: 100vw;
      padding: 25px 15px 15px 15px;
      box-sizing: border-box;
      overflow-x: auto;
      overflow-y: visible;
    }

    .host-badge { background: #f39c12; color: #111; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    .waiting-msg { font-style: italic; color: #f1c40f; font-size: 14px; margin-top: 8px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 300; }
    .modal-card { background: var(--panel-bg); padding: 16px; border-radius: 12px; width: min(90vw, 320px); max-height: 80vh; overflow-y: auto; text-align: left; }
    .lobby-item { background: #222; padding: 8px; margin: 6px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

    .chat-section {
      margin-top: auto;
      padding-top: 10px;
      padding-bottom: 5px;
    }
    .chat-box { 
      background: rgba(0,0,0,0.6); 
      width: min(90%, 400px); 
      height: 70px; 
      overflow-y: auto; 
      margin: 0 auto 6px auto; 
      border-radius: 6px; 
      padding: 6px; 
      text-align: left; 
      font-size: 12px; 
    }

    .floating-emoji {
      position: fixed;
      font-size: 45px;
      z-index: 999;
      pointer-events: none;
      animation: floatUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.5) rotate(0deg);
      }
      20% {
        opacity: 1;
        transform: translateY(-30px) scale(1.2) rotate(-10deg);
      }
      80% {
        opacity: 1;
        transform: translateY(-120px) scale(1) rotate(10deg);
      }
      100% {
        opacity: 0;
        transform: translateY(-180px) scale(0.8) rotate(0deg);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="game-title">🎴 Uno Game</div>
    <select class="theme-picker" onchange="changeTheme(this.value)">
      <option value="dark">🌙 Dark</option>
      <option value="wood">🪵 Wood</option>
      <option value="neon">⚡ Neon</option>
    </select>
  </header>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <h2>Join Room</h2>
    <input type="text" id="username" placeholder="Your Name" /><br>
    
    <select id="avatarSelect">
      <option value="🤠">🤠 Cowboy</option>
      <option value="🤖">🤖 Robot</option>
      <option value="🦊">🦊 Fox</option>
      <option value="🥷">🥷 Ninja</option>
      <option value="👑">👑 Crown</option>
      <option value="👽">👽 Alien</option>
      <option value="🦄">🦄 Unicorn</option>
      <option value="🦁">🦁 Lion</option>
      <option value="🐉">🐉 Dragon</option>
      <option value="👻">👻 Ghost</option>
      <option value="🐼">🐼 Panda</option>
      <option value="🐯">🐯 Tiger</option>
      <option value="🧙‍♂️">🧙‍♂️ Wizard</option>
      <option value="🚀">🚀 Rocket</option>
      <option value="🔥">🔥 Fire</option>
      <option value="😎">😎 Cool</option>
    </select><br>

    <input type="text" id="roomCode" placeholder="Room Code" /><br>
    <button onclick="joinDirect()">Join / Create</button><br>
    <button onclick="openLobbyBrowser()" style="background-color: #17a2b8;">🌐 Browse Lobbies</button>
  </div>

  <!-- LOBBY BROWSER MODAL -->
  <div id="lobbyBrowserModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Available Lobbies</h3>
      <div id="lobbyListContainer">Loading...</div>
      <button onclick="closeLobbyBrowser()" style="background-color: #6c757d; width: 100%;">Close</button>
    </div>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen" class="hidden">
    <h2 id="roomTitle"></h2>
    <h3 id="countdownDisplay" style="color:#f1c40f;"></h3>
    
    <div style="background: var(--panel-bg); padding: 10px; border-radius: 8px; margin: 10px auto; max-width: 320px;">
      <h4>⚙️ House Rules</h4>
      <label><input type="checkbox" id="ruleStacking" onchange="updateRules()"> Allow +2/+4 Stacking</label><br>
      <label><input type="checkbox" id="ruleJumpIn" onchange="updateRules()"> Allow Jump-In</label><br>
      <label><input type="checkbox" id="rule70" onchange="updateRules()"> 7-0 Rule</label>
    </div>

    <h3>Players:</h3>
    <ul id="playerList" style="list-style:none; padding:0;"></ul>

    <div id="hostControls">
      <button id="startBtn" onclick="requestStart()" style="background-color: #007bff;">Start Game</button>
    </div>
    <div id="guestWaitingMsg" class="waiting-msg hidden">
      ⏳ Waiting for host to start the game...
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
    <div class="turn-bar">
      Current: <span id="currentTurn" style="color:#2ecc71;">--</span><br>
      <small style="color:#aaa;">Next up: <span id="nextTurn">--</span></small>
      <div id="stackIndicator" style="color:#e74c3c; font-weight:bold;"></div>
    </div>

    <div class="timer-container">
      <div id="timerFill" class="timer-fill"></div>
    </div>

    <div class="pile-area" id="pileArea">
      <div id="dirArrow" class="direction-arrow"></div>
    </div>

    <div>
      <button onclick="drawCard()" style="background-color: #e67e22;">Draw Card</button>
      <button id="unoBtn" onclick="callUno()" style="background-color: #e74c3c;">🚨 UNO!</button>
      <button onclick="openCatchModal()" style="background-color: #fd7e14;">🎯 Catch!</button>
    </div>

    <div style="margin-top: 4px;">
      <button onclick="sendEmoji('😂')">😂</button>
      <button onclick="sendEmoji('🤬')">🤬</button>
      <button onclick="sendEmoji('💩')">💩</button>
      <button onclick="sendEmoji('⏱️')">⏱️</button>
    </div>

    <div id="hand" class="hand-container"></div>

    <div class="chat-section">
      <div class="chat-box" id="chatBox"></div>
      <input type="text" id="chatInput" placeholder="Send chat..." onkeydown="if(event.key==='Enter') sendChat()"/>
    </div>
  </div>

  <!-- COLOR PICKER MODAL -->
  <div id="colorModal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">
      <h3>Select Wild Color</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 140px;">
        <button class="Red" onclick="selectWildColor('Red')">Red</button>
        <button class="Blue" onclick="selectWildColor('Blue')">Blue</button>
        <button class="Green" onclick="selectWildColor('Green')">Green</button>
        <button class="Yellow" onclick="selectWildColor('Yellow')">Yellow</button>
      </div>
    </div>
  </div>

  <!-- SWAP PLAYER TARGET MODAL -->
  <div id="swapModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Select Target Player</h3>
      <div id="swapPlayerList"></div>
    </div>
  </div>

  <!-- CATCH UNO MODAL -->
  <div id="catchModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Who forgot to call UNO?</h3>
      <div id="catchPlayerList"></div>
      <button onclick="document.getElementById('catchModal').classList.add('hidden')" style="background-color:#6c757d; width:100%;">Cancel</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let pendingWildCardId = null;
    let pendingSwapCardId = null;
    let activePlayersList = [];
    let isHost = false;
    let is70Enabled = false;

    function changeTheme(theme) {
      document.body.className = '';
      if (theme !== 'dark') document.body.classList.add('theme-' + theme);
    }

    function joinDirect() {
      const username = document.getElementById('username').value;
      const roomCode = document.getElementById('roomCode').value;
      const avatar = document.getElementById('avatarSelect').value;
      if (username && roomCode) {
        socket.emit('joinRoom', { username, roomCode, avatar });
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');
        document.getElementById('roomTitle').innerText = "Room: " + roomCode;
      }
    }

    function openLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.remove('hidden');
      socket.emit('getLobbies');
    }

    function closeLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.add('hidden');
    }

    socket.on('lobbyList', (lobbies) => {
      const container = document.getElementById('lobbyListContainer');
      if (lobbies.length === 0) {
        container.innerHTML = '<p style="color:#aaa;">No active lobbies found.</p>';
        return;
      }
      container.innerHTML = lobbies.map(l => `
        <div class="lobby-item">
          <div><strong>Room ${l.code}</strong> (${l.players}/12)</div>
          <button onclick="joinFromBrowser('${l.code}')">Join</button>
        </div>
      `).join('');
    });

    function joinFromBrowser(code) {
      document.getElementById('roomCode').value = code;
      closeLobbyBrowser();
      joinDirect();
    }

    function updateRules() {
      if (!isHost) return;
      socket.emit('updateRules', {
        allowStacking: document.getElementById('ruleStacking').checked,
        jumpIn: document.getElementById('ruleJumpIn').checked,
        '70Rule': document.getElementById('rule70').checked
      });
    }

    function requestStart() {
      if (isHost) socket.emit('requestStartGame');
    }

    function drawCard() { socket.emit('drawCard'); }
    
    // INSTANT DIRECT CALL FOR UNO
    function callUno() { 
      socket.emit('callUno'); 
    }

    socket.on('unoAcknowledged', () => {
      const unoBtn = document.getElementById('unoBtn');
      unoBtn.style.backgroundColor = '#27ae60';
      setTimeout(() => unoBtn.style.backgroundColor = '#e74c3c', 2000);
    });

    function handleCardClick(cardId, color, val) {
      // ONLY SHOW SWAP PROMPT IF 7-0 IS ACTIVE OR FOR SWAP CARDS
      if (val === 'Swap' || (val === '7' && is70Enabled)) {
        pendingSwapCardId = cardId;
        openSwapModal(color);
      } else if (color === 'Wild') {
        pendingWildCardId = cardId;
        document.getElementById('colorModal').classList.remove('hidden');
      } else {
        socket.emit('playCard', { cardId });
      }
    }

    function openSwapModal(color) {
      const container = document.getElementById('swapPlayerList');
      container.innerHTML = activePlayersList
        .filter(p => p.id !== socket.id)
        .map(p => `<button onclick="confirmSwap('${p.id}', '${color}')" style="width:100%; margin:4px 0;">Swap with ${p.avatar} ${p.name}</button>`)
        .join('');
      document.getElementById('swapModal').classList.remove('hidden');
    }

    function confirmSwap(targetId, color) {
      document.getElementById('swapModal').classList.add('hidden');
      if (color === 'Wild') {
        pendingWildCardId = pendingSwapCardId;
        document.getElementById('colorModal').classList.remove('hidden');
        window.tempSwapTarget = targetId;
      } else {
        socket.emit('playCard', { cardId: pendingSwapCardId, swapTargetId: targetId });
      }
    }

    function selectWildColor(chosenColor) {
      document.getElementById('colorModal').classList.add('hidden');
      if (pendingWildCardId) {
        socket.emit('playCard', { 
          cardId: pendingWildCardId, 
          chosenColor, 
          swapTargetId: window.tempSwapTarget 
        });
        pendingWildCardId = null;
        window.tempSwapTarget = null;
      }
    }

    function openCatchModal() {
      const container = document.getElementById('catchPlayerList');
      container.innerHTML = activePlayersList
        .filter(p => p.id !== socket.id)
        .map(p => `<button onclick="executeCatch('${p.id}')" style="width:100%; margin:4px 0;">Catch ${p.avatar} ${p.name}</button>`)
        .join('');
      document.getElementById('catchModal').classList.remove('hidden');
    }

    function executeCatch(targetId) {
      document.getElementById('catchModal').classList.add('hidden');
      socket.emit('catchUno', targetId);
    }

    socket.on('startCountdown', (sec) => {
      document.getElementById('countdownDisplay').innerText = `Game starting in ${sec}...`;
      document.getElementById('hostControls').classList.add('hidden');
      document.getElementById('guestWaitingMsg').classList.add('hidden');
    });

    socket.on('errorMsg', (msg) => { alert(msg); location.reload(); });

    socket.on('updateLobby', (data) => {
      activePlayersList = data.players;
      isHost = (data.hostId === socket.id);

      document.getElementById('playerList').innerHTML = data.players.map(p => `
        <li>${p.avatar} ${p.name} ${p.id === data.hostId ? '<span class="host-badge">HOST</span>' : ''}</li>
      `).join('');

      document.getElementById('ruleStacking').disabled = !isHost;
      document.getElementById('ruleJumpIn').disabled = !isHost;
      document.getElementById('rule70').disabled = !isHost;

      if (data.rules) {
        document.getElementById('ruleStacking').checked = !!data.rules.allowStacking;
        document.getElementById('ruleJumpIn').checked = !!data.rules.jumpIn;
        document.getElementById('rule70').checked = !!data.rules['70Rule'];
        is70Enabled = !!data.rules['70Rule'];
      }

      if (isHost) {
        document.getElementById('hostControls').classList.remove('hidden');
        document.getElementById('guestWaitingMsg').classList.add('hidden');
      } else {
        document.getElementById('hostControls').classList.add('hidden');
        document.getElementById('guestWaitingMsg').classList.remove('hidden');
      }
    });

    socket.on('timerUpdate', (secondsLeft) => {
      document.getElementById('timerFill').style.width = ((secondsLeft / 30) * 100) + '%';
    });

    function getCardGraphic(val) {
      if (val === 'Reverse') return '⇄';
      if (val === 'Skip') return '⊘';
      if (val === 'Swap') return '🔄';
      return val;
    }

    function createCardMarkup(c, zIndex = 0, styleStr = '', onClickAttr = '', cardId = '') {
      const symbol = getCardGraphic(c.value);
      return `
        <div id="card-${cardId}" class="card ${c.color}" style="z-index:${zIndex}; ${styleStr}" ${onClickAttr}>
          <div class="corner">${symbol}</div>
          <div class="center-oval"><span class="center-number">${symbol}</span></div>
        </div>
      `;
    }

    socket.on('gameState', (data) => {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      if (data.rules) {
        is70Enabled = !!data.rules['70Rule'];
      }

      document.getElementById('currentTurn').innerText = data.currentTurn;
      document.getElementById('nextTurn').innerText = data.nextTurn;

      const stackBox = document.getElementById('stackIndicator');
      stackBox.innerText = data.stackedDraw > 0 ? `🔥 +${data.stackedDraw} STACKED!` : '';

      const dirArrow = document.getElementById('dirArrow');
      if (data.direction === -1) dirArrow.classList.add('reverse');
      else dirArrow.classList.remove('reverse');

      const pileArea = document.getElementById('pileArea');
      pileArea.innerHTML = `<div id="dirArrow" class="${dirArrow.className}"></div>` + 
        data.discardPile.map((c, i) => {
          const transformStr = `transform: translate(${c.offsetX}px, ${c.offsetY}px) rotate(${c.rot}deg);`;
          return createCardMarkup(c, i, transformStr);
        }).join('');
    });

    socket.on('yourHand', (cards) => {
      const handDiv = document.getElementById('hand');
      const total = cards.length;

      const overlapMargin = total > 5 ? Math.max(-45, -15 - (total * 2)) : -28;
      const maxRotate = Math.min(20, total * 2);

      handDiv.innerHTML = cards.map((c, idx) => {
        const angle = total > 1 ? ((idx - (total - 1) / 2) / ((total - 1) / 2)) * maxRotate : 0;
        const yOffset = Math.abs(angle) * 0.3;

        const styleStr = `margin-left: ${idx === 0 ? 0 : overlapMargin}px; transform: rotate(${angle}deg) translateY(${yOffset}px);`;
        const clickCode = `onclick="handleCardClick('${c.id}', '${c.color}', '${c.value}')"`;
        
        return createCardMarkup(c, idx, styleStr, clickCode, c.id);
      }).join('');
    });

    function sendChat() {
      const input = document.getElementById('chatInput');
      if (input.value.trim()) {
        socket.emit('sendChat', input.value.trim());
        input.value = '';
      }
    }

    socket.on('chatMessage', (data) => {
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div><strong>${data.sender}:</strong> ${data.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    function sendEmoji(emoji) {
      socket.emit('sendEmoji', emoji);
    }

    socket.on('displayEmoji', (data) => {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.innerText = data.emoji;
      el.style.left = (Math.random() * 60 + 20) + 'vw';
      el.style.top = '65vh';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    });

    socket.on('gameOver', (finalLeaderboard) => {
      alert("🎉 Game Over!\n\nRankings:\n" + finalLeaderboard.map((n, i) => `${i + 1}. ${n}`).join('\n'));
      location.reload();
    });
  </script>
</body>
</html>
