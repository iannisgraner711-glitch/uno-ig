<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UNO Extreme Multiplayer</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #ff4757;
    }

    body.theme-light {
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #2d3436;
      --accent-color: #007bff;
    }

    body.theme-neon {
      --bg-color: #050505;
      --card-bg: #0d0d1a;
      --text-color: #00f0ff;
      --accent-color: #ff007f;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(45deg, #ff4757, #ffa502, #2ed573, #1e90ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .card-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
    }

    .hidden { display: none !important; }

    /* Custom Input Styles */
    input[type="text"], input[type="password"], select {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: var(--text-color);
      box-sizing: border-box;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    /* UNO Cards Engine */
    .hand-container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 130px;
      padding-bottom: 10px;
      margin-top: auto;
    }

    .card {
      width: 70px;
      height: 105px;
      border-radius: 8px;
      border: 2px solid #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      box-sizing: border-box;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, margin 0.2s;
    }

    .card.selected {
      transform: translateY(-20px) scale(1.05) !important;
      box-shadow: 0 0 12px #00f0ff;
    }

    .card.Red { background: #e74c3c; color: white; }
    .card.Blue { background: #2980b9; color: white; }
    .card.Green { background: #27ae60; color: white; }
    .card.Yellow { background: #f1c40f; color: black; }
    .card.Wild { background: #2c3e50; color: white; }

    .card.rarity-rare {
      border: 2px solid #f1c40f;
      box-shadow: 0 0 10px #f1c40f;
    }

    .card.rarity-mythic {
      border: 2px solid #ff007f;
      animation: mythicGlow 1.5s infinite alternate;
    }

    @keyframes mythicGlow {
      from { box-shadow: 0 0 8px #ff007f, 0 0 15px #00f0ff; }
      to { box-shadow: 0 0 18px #ff007f, 0 0 30px #00f0ff; }
    }

    .corner { font-size: 11px; line-height: 1; }
    .corner.bottom-right { transform: rotate(180deg); align-self: flex-end; }
    .center-oval {
      background: rgba(255, 255, 255, 0.9);
      color: #111;
      border-radius: 50%;
      width: 42px;
      height: 28px;
      align-self: center;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: rotate(-25deg);
    }

    .pile-area {
      position: relative;
      height: 140px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pile-area .card {
      position: absolute;
    }

    /* Chat Section */
    .chat-section {
      height: 100px;
      display: flex;
      flex-direction: column;
      margin-top: 6px;
    }

    .chat-box {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      padding: 6px;
      overflow-y: auto;
      font-size: 12px;
    }

    .turn-bar {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .timer-container {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .timer-fill {
      height: 100%;
      background: #2ecc71;
      width: 100%;
      transition: width 1s linear;
    }

    /* Red 7 Special Effects */
    .red7-active-glow {
      animation: red7Pulse 0.5s infinite alternate;
    }

    @keyframes red7Pulse {
      from { box-shadow: 0 0 10px #ff0000; }
      to { box-shadow: 0 0 25px #ff0000, 0 0 40px #ff4757; }
    }

    .shake {
      animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeAnim {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Debug Grid */
    .debug-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
    }

    .debug-btn {
      font-size: 11px;
      padding: 6px;
      background: #333;
    }

    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: particleFly 0.8s ease-out forwards;
      z-index: 2000;
    }

    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .floating-emoji {
      position: fixed;
      font-size: 32px;
      pointer-events: none;
      animation: emojiFloat 2s forwards;
      z-index: 1500;
    }

    @keyframes emojiFloat {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-120px) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">🔥 UNO Extreme</div>
    <div>
      <select onchange="changeTheme(this.value)" style="width: auto; padding: 4px; margin: 0; font-size: 12px;">
        <option value="dark">Dark Theme</option>
        <option value="light">Light Theme</option>
        <option value="neon">Neon Theme</option>
      </select>
      <button onclick="goHome()" style="padding: 4px 8px; font-size: 12px;">🏠 Home</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="card-panel">
      <h2>Join Game</h2>
      
      <label>Your Username:</label>
      <input type="text" id="username" placeholder="Enter name...">

      <label>Avatar:</label>
      <select id="avatarSelect">
        <option value="😀">😀 Classic</option>
        <option value="😎">😎 Cool</option>
        <option value="🤖">🤖 Robot</option>
        <option value="🔥">🔥 Fire</option>
        <option value="👑">👑 Crown</option>
      </select>

      <label>Room Code:</label>
      <input type="text" id="roomCode" placeholder="Enter room code...">

      <label>Password (Optional):</label>
      <input type="password" id="roomPassword" placeholder="Room password...">

      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 12px;">
        <input type="checkbox" id="privateCheck"> Private Lobby (Hidden from Browser)
      </label>

      <button onclick="joinDirect()" style="width: 100%; padding: 12px; font-size: 16px;">Play Now</button>
      <button onclick="openLobbyBrowser()" style="width: 100%; margin-top: 8px; background-color: #6c757d;">Browse Public Lobbies</button>

      <!-- Stats Card -->
      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; text-align: center;">
        <div>
          <div style="font-size: 12px; color: #aaa;">Wins</div>
          <strong id="statWins" style="font-size: 18px; color: #2ecc71;">0</strong>
        </div>
        <div>
          <div style="font-size: 12px; color: #aaa;">Losses</div>
          <strong id="statLosses" style="font-size: 18px; color: #e74c3c;">0</strong>
        </div>
        <div>
          <div style="font-size: 12px; color: #aaa;">Win Rate</div>
          <strong id="statRate" style="font-size: 18px; color: #f1c40f;">0%</strong>
        </div>
      </div>
    </div>

    <!-- Lobby Browser Modal -->
    <div id="lobbyBrowserModal" class="modal-overlay hidden">
      <div class="modal-card">
        <h3>Public Lobbies</h3>
        <div id="lobbyListContainer" style="max-height: 250px; overflow-y: auto;"></div>
        <button onclick="closeLobbyBrowser()" style="width: 100%; margin-top: 12px; background: #6c757d;">Close</button>
      </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobbyScreen" class="card-panel hidden">
      <h2 id="roomTitle"></h2>
      <h3 id="countdownDisplay" style="color:#f1c40f;"></h3>

      <button onclick="copyInviteLink()" style="background-color: #17a2b8; font-size: 12px; padding: 4px 10px;">📋 Copy Invite Link</button>

      <h3>Players:</h3>
      <ul id="playerList" style="list-style:none; padding:0; font-size: 16px;"></ul>

      <div style="margin: 10px 0; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px;">
        <label style="font-size: 14px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 6px;">
          <input type="checkbox" id="red7Toggle" onchange="toggleRed7(this.checked)">
          🔥 Enable Red 7 Rule
        </label>

        <label style="font-size: 14px; font-weight: bold; cursor: pointer; display: block;">
          <input type="checkbox" id="moreCardsToggle" onchange="toggleMoreCards(this.checked)">
          ✨ Enable 'More Cards' Mode (Rare & Mythic Cards)
        </label>
      </div>

      <div id="hostControls">
        <button id="startBtn" onclick="requestStart()" style="background-color: #007bff; width: 100%; padding: 10px;">Start Game</button>
      </div>
      <div id="guestWaitingMsg" class="hidden" style="font-style:italic; color:#f1c40f; text-align: center;">
        ⏳ Waiting for host to start the game...
      </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
      <div class="turn-bar">
        Current: <span id="currentTurn" style="color:#2ecc71;">--</span><br>
        <small style="color:#aaa; font-size:12px;">Next: <span id="nextTurn">--</span></small>
        <div id="stackIndicator" style="color:#e74c3c; font-weight:bold; font-size:14px;"></div>
        <div id="domainIndicator" style="color:#00f0ff; font-weight:bold; font-size:13px;"></div>
      </div>

      <div class="timer-container">
        <div id="timerFill" class="timer-fill"></div>
      </div>

      <div class="pile-area" id="pileArea">
        <div id="dirArrow" class="direction-arrow"></div>
        <div id="handOverlays"></div>
      </div>

      <div style="display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 8px;">
        <button id="playSelectedBtn" onclick="submitSelectedCards()" style="background-color: #28a745;" class="hidden">Play Selected</button>
        <button onclick="drawCard()" style="background-color: #e67e22;">Draw Card</button>
        <button id="unoBtn" onclick="callUno()" style="background-color: #e74c3c;">🚨 UNO!</button>
        <button id="extendHandBtn" onclick="extendHand()" style="background-color: #d35400;">✋ Extend Hand</button>
      </div>

      <div style="margin-top: 6px; text-align: center;">
        <button onclick="sendEmoji('😂')">😂</button>
        <button onclick="sendEmoji('🤬')">🤬</button>
        <button onclick="sendEmoji('💩')">💩</button>
        <button onclick="sendEmoji('⏱️')">⏱️</button>
      </div>

      <div id="hand" class="hand-container"></div>
      <div id="revealedHandsContainer"></div>

      <div class="chat-section">
        <div class="chat-box" id="chatBox"></div>
        <input type="text" id="chatInput" placeholder="Type message... (/give 67 for debug)" onkeydown="if(event.key==='Enter') sendChat()"/>
      </div>
    </div>

  </div>

  <!-- Color Choice Modal -->
  <div id="colorModal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">
      <h3>Select Color</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 140px;">
        <button class="Red" style="background:#e74c3c;" onclick="selectWildColor('Red')">Red</button>
        <button class="Blue" style="background:#2980b9;" onclick="selectWildColor('Blue')">Blue</button>
        <button class="Green" style="background:#27ae60;" onclick="selectWildColor('Green')">Green</button>
        <button class="Yellow" style="background:#f1c40f; color:#000;" onclick="selectWildColor('Yellow')">Yellow</button>
      </div>
    </div>
  </div>

  <!-- Debug Cheat Modal -->
  <div id="debugModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>🛠️ Debug Card Spawners</h3>
      <p style="font-size:12px; color:#aaa;">Spawn card to hand:</p>
      
      <strong>Standard Cards:</strong>
      <div class="debug-grid">
        <button class="debug-btn" onclick="spawnDebugCard('Red', '7')">Red 7</button>
        <button class="debug-btn" onclick="spawnDebugCard('Wild', '+4')">Wild +4</button>
        <button class="debug-btn" onclick="spawnDebugCard('Blue', 'Skip')">Blue Skip</button>
        <button class="debug-btn" onclick="spawnDebugCard('Yellow', 'Reverse')">Yellow Reverse</button>
      </div>

      <strong style="display:block; margin-top:10px;">Rare Cards:</strong>
      <div class="debug-grid">
        <button class="debug-btn" onclick="spawnDebugCard('Wild', 'Roulette', 'rare')">🎲 Roulette</button>
        <button class="debug-btn" onclick="spawnDebugCard('Wild', 'Spy', 'rare')">👁️ Spy</button>
        <button class="debug-btn" onclick="spawnDebugCard('Wild', 'Shield', 'rare')">🛡️ Shield</button>
        <button class="debug-btn" onclick="spawnDebugCard('Wild', 'TaxCollector', 'rare')">💰 Tax Collector</button>
      </div>

      <strong style="display:block; margin-top:10px; color:#ff007f;">Mythic Cards:</strong>
      <div class="debug-grid">
        <button class="debug-btn" style="background:#ff007f;" onclick="spawnDebugCard('Wild', '+25', 'mythic')">💣 +25 Nuke</button>
        <button class="debug-btn" style="background:#7f00ff;" onclick="spawnDebugCard('Wild', 'Reset', 'mythic')">👑 Golden Reset</button>
        <button class="debug-btn" style="background:#00f0ff;" onclick="spawnDebugCard('Wild', 'Domain', 'mythic')">🌀 Domain Lock</button>
        <button class="debug-btn" style="background:#f1c40f; color:#000;" onclick="spawnDebugCard('Wild', 'Reflect', 'mythic')">🪞 Reflect</button>
      </div>

      <button onclick="closeDebugMenu()" style="background-color: #6c757d; width: 100%; margin-top: 15px;">Close Debug</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let isHost = false;
    let selectedCards = [];
    let currentHand = [];
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'playCard') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'drawCard') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'uno') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.15);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'tick') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, now);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'startChime') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(261.63, now);
        osc.frequency.setValueAtTime(329.63, now + 0.1);
        osc.frequency.setValueAtTime(392.00, now + 0.2);
        osc.frequency.setValueAtTime(523.25, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      } else if (type === 'slap') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'victory') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.15);
        osc.frequency.setValueAtTime(659.25, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
        osc.start(now);
        osc.stop(now + 0.8);
      } else if (type === 'defeat') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(120, now + 0.5);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      }
    }

    function triggerParticleExplosion(x, y, count = 25) {
      const colors = ['#e74c3c', '#2980b9', '#27ae60', '#f1c40f', '#ff007f', '#00f0ff'];
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.floor(Math.random() * 8) + 6;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 120 + 30;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function triggerScreenShake() {
      document.body.classList.add('shake');
      setTimeout(() => document.body.classList.remove('shake'), 400);
    }

    function loadStats() {
      const wins = parseInt(localStorage.getItem('uno_wins') || '0', 10);
      const losses = parseInt(localStorage.getItem('uno_losses') || '0', 10);
      const total = wins + losses;
      const rate = total > 0 ? Math.round((wins / total) * 100) : 0;

      document.getElementById('statWins').innerText = wins;
      document.getElementById('statLosses').innerText = losses;
      document.getElementById('statRate').innerText = `${rate}%`;
    }

    function recordGameResult(isWinner) {
      if (isWinner) {
        const wins = parseInt(localStorage.getItem('uno_wins') || '0', 10) + 1;
        localStorage.setItem('uno_wins', wins);
      } else {
        const losses = parseInt(localStorage.getItem('uno_losses') || '0', 10) + 1;
        localStorage.setItem('uno_losses', losses);
      }
      loadStats();
    }

    function goHome() {
      window.location.hash = '';
      location.reload();
    }

    function getUrlParams() {
      const hash = window.location.hash.substring(1);
      const parts = hash.split('?');
      const room = parts[0] || '';
      const params = new URLSearchParams(parts[1] || '');
      return { room, sessionId: params.get('session') };
    }

    const urlData = getUrlParams();
    let sessionId = urlData.sessionId || localStorage.getItem('uno_session_id');
    if (!sessionId) {
      sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
    }
    localStorage.setItem('uno_session_id', sessionId);

    function changeTheme(theme) {
      document.body.className = '';
      if (theme !== 'dark') document.body.classList.add('theme-' + theme);
    }

    function joinDirect() {
      initAudio();
      let username = document.getElementById('username').value.trim();
      let roomCode = document.getElementById('roomCode').value.trim();
      const avatar = document.getElementById('avatarSelect').value;
      const isPrivate = document.getElementById('privateCheck').checked;
      const password = document.getElementById('roomPassword').value.trim();

      if (!roomCode) return alert("Please enter a room code!");

      localStorage.setItem('uno_username', username);
      localStorage.setItem('uno_avatar', avatar);
      window.location.hash = `${roomCode}?session=${sessionId}`;

      socket.emit('joinRoom', { username, roomCode, avatar, sessionId, isPrivate, password });

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = "Room: " + roomCode;
    }

    function toggleRed7(enabled) {
      if (isHost) socket.emit('toggleRed7Rule', enabled);
    }

    function toggleMoreCards(enabled) {
      if (isHost) socket.emit('toggleMoreCards', enabled);
    }

    function extendHand() {
      socket.emit('extendHand');
    }

    function copyInviteLink() {
      const roomCode = document.getElementById('roomCode').value.trim() || urlData.room;
      const url = `${window.location.origin}/#${roomCode}`;
      navigator.clipboard.writeText(url).then(() => alert("Copied Invite Link!"));
    }

    window.addEventListener('load', () => {
      loadStats();
      const savedName = localStorage.getItem('uno_username');
      const savedAvatar = localStorage.getItem('uno_avatar');

      if (savedName) document.getElementById('username').value = savedName;
      if (savedAvatar) document.getElementById('avatarSelect').value = savedAvatar;

      if (urlData.room) {
        document.getElementById('roomCode').value = urlData.room;
        joinDirect();
      }
    });

    function openLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.remove('hidden');
      socket.emit('getLobbies');
    }

    function closeLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.add('hidden');
    }

    socket.on('lobbyList', (lobbies) => {
      const container = document.getElementById('lobbyListContainer');
      if (lobbies.length === 0) {
        container.innerHTML = '<p style="color:#aaa;">No public lobbies found.</p>';
        return;
      }
      container.innerHTML = lobbies.map(l => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #333;">
          <div>
            <strong>Room ${l.code}</strong> ${l.hasPassword ? '🔒' : ''} (${l.players}/12)<br>
            <small style="color:#aaa;">Red 7: ${l.red7Rule ? 'ON' : 'OFF'} | More Cards: ${l.moreCards ? 'ON' : 'OFF'}</small>
          </div>
          <button onclick="joinFromBrowser('${l.code}', ${l.hasPassword})">Join</button>
        </div>
      `).join('');
    });

    function joinFromBrowser(code, hasPassword) {
      document.getElementById('roomCode').value = code;
      if (hasPassword) {
        const pwd = prompt("Enter Room Password:");
        if (pwd === null) return;
        document.getElementById('roomPassword').value = pwd;
      }
      closeLobbyBrowser();
      joinDirect();
    }

    function requestStart() {
      if (isHost) socket.emit('requestStartGame');
    }

    function kickPlayer(targetSessionId) {
      if (isHost) socket.emit('kickPlayer', targetSessionId);
    }

    socket.on('kickedMsg', () => {
      alert("You were kicked from the lobby.");
      goHome();
    });

    function drawCard() { 
      selectedCards = [];
      updateHandDisplay();
      socket.emit('drawCard'); 
    }
    
    function callUno() { socket.emit('callUno'); }

    socket.on('unoAcknowledged', () => {
      playSound('uno');
      const unoBtn = document.getElementById('unoBtn');
      unoBtn.style.backgroundColor = '#27ae60';
      setTimeout(() => unoBtn.style.backgroundColor = '#e74c3c', 2000);
    });

    socket.on('unoCalledEvent', (data) => {
      playSound('uno');
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div>🚨 <strong>${data.sender}</strong> called UNO!</div>`;
      box.scrollTop = box.scrollHeight;
    });

    socket.on('red7Triggered', () => {
      triggerScreenShake();
      playSound('uno');
      document.getElementById('extendHandBtn').classList.add('red7-active-glow');
      document.getElementById('pileArea').classList.add('red7-active-glow');
      document.getElementById('handOverlays').innerHTML = '';
    });

    socket.on('red7Ended', () => {
      document.getElementById('extendHandBtn').classList.remove('red7-active-glow');
      document.getElementById('pileArea').classList.remove('red7-active-glow');
      setTimeout(() => {
        document.getElementById('handOverlays').innerHTML = '';
      }, 1000);
    });

    socket.on('handExtendedEvent', (data) => {
      playSound('slap');
      const overlays = document.getElementById('handOverlays');
      const angle = (data.order * 60) % 360;
      
      const handEl = document.createElement('div');
      handEl.style.position = 'absolute';
      handEl.style.fontSize = '24px';
      handEl.innerText = `${data.avatar}✋`;
      handEl.style.transform = `rotate(${angle}deg) translateY(-20px)`;
      
      overlays.appendChild(handEl);
    });

    socket.on('handPenaltyMsg', (msg) => {
      playSound('defeat');
      alert(msg);
    });

    socket.on('cardPlayedEvent', (data) => {
      playSound('playCard');
      if (data.isWildPlus4 || data.isHeavyStack) {
        triggerScreenShake();
        const pile = document.getElementById('pileArea');
        const rect = pile.getBoundingClientRect();
        triggerParticleExplosion(rect.left + rect.width / 2, rect.top + rect.height / 2, 30);
      }
    });

    socket.on('cardDrawnEvent', () => {
      playSound('drawCard');
    });

    function handleCardClick(cardId) {
      const clickedCard = currentHand.find(c => c.id === cardId);
      if (!clickedCard) return;

      const index = selectedCards.indexOf(cardId);
      if (index > -1) {
        selectedCards.splice(index, 1);
      } else {
        if (selectedCards.length > 0) {
          const firstSelected = currentHand.find(c => c.id === selectedCards[0]);
          if (firstSelected && firstSelected.value !== clickedCard.value) selectedCards = [cardId];
          else selectedCards.push(cardId);
        } else {
          selectedCards.push(cardId);
        }
      }
      updateHandDisplay();
    }

    function updateHandDisplay() {
      const btn = document.getElementById('playSelectedBtn');
      if (selectedCards.length > 0) {
        btn.classList.remove('hidden');
        btn.innerText = `Play Selected (${selectedCards.length})`;
      } else {
        btn.classList.add('hidden');
      }

      currentHand.forEach(c => {
        const el = document.getElementById(`card-${c.id}`);
        if (el) {
          if (selectedCards.includes(c.id)) el.classList.add('selected');
          else el.classList.remove('selected');
        }
      });
    }

    function submitSelectedCards() {
      if (selectedCards.length === 0) return;
      const lastCardId = selectedCards[selectedCards.length - 1];
      const lastCard = currentHand.find(c => c.id === lastCardId);

      if (lastCard && (lastCard.color === 'Wild' || selectedCards.length > 1)) {
        document.getElementById('colorModal').classList.remove('hidden');
      } else {
        socket.emit('playCards', { cardIds: selectedCards });
        selectedCards = [];
        updateHandDisplay();
      }
    }

    function selectWildColor(chosenColor) {
      document.getElementById('colorModal').classList.add('hidden');
      socket.emit('playCards', { cardIds: selectedCards, chosenColor });
      selectedCards = [];
      updateHandDisplay();
    }

    socket.on('startCountdown', (sec) => {
      if (sec > 0) playSound('tick');
      else playSound('startChime');
      
      document.getElementById('countdownDisplay').innerText = sec > 0 ? `Game starting in ${sec}...` : `GO!`;
      document.getElementById('hostControls').classList.add('hidden');
      document.getElementById('guestWaitingMsg').classList.add('hidden');
    });

    socket.on('errorMsg', (msg) => { alert(msg); goHome(); });

    socket.on('updateLobby', (data) => {
      isHost = (data.hostSessionId === sessionId);

      document.getElementById('red7Toggle').checked = data.red7Rule;
      document.getElementById('red7Toggle').disabled = !isHost;

      document.getElementById('moreCardsToggle').checked = data.moreCards;
      document.getElementById('moreCardsToggle').disabled = !isHost;

      document.getElementById('playerList').innerHTML = data.players.map(p => `
        <li style="margin: 6px 0; display:flex; justify-content:space-between; align-items:center;">
          <span>${p.avatar} ${p.name} ${p.sessionId === data.hostSessionId ? '<strong style="color:#f1c40f;">[HOST]</strong>' : ''}</span>
          ${isHost && p.sessionId !== sessionId ? `<button onclick="kickPlayer('${p.sessionId}')" style="background:#e74c3c; padding:2px 6px; font-size:11px;">Kick</button>` : ''}
        </li>
      `).join('');

      if (isHost) {
        document.getElementById('hostControls').classList.remove('hidden');
        document.getElementById('guestWaitingMsg').classList.add('hidden');
      } else {
        document.getElementById('hostControls').classList.add('hidden');
        document.getElementById('guestWaitingMsg').classList.remove('hidden');
      }
    });

    socket.on('timerUpdate', (secondsLeft) => {
      if (secondsLeft <= 5 && secondsLeft > 0) playSound('tick');
      document.getElementById('timerFill').style.width = ((secondsLeft / 30) * 100) + '%';
    });

    function getCardGraphic(val) {
      if (val === 'Reverse') return '⇄';
      if (val === 'Skip') return '⊘';
      if (val === '+25') return '💣+25';
      if (val === 'Reset') return '👑';
      if (val === 'Domain') return '🌀';
      if (val === 'Reflect') return '🪞';
      if (val === 'Roulette') return '🎲';
      if (val === 'Spy') return '👁️';
      if (val === 'Shield') return '🛡️';
      if (val === 'TaxCollector') return '💰';
      return val;
    }

    function createCardMarkup(c, zIndex = 0, styleStr = '', onClickAttr = '', cardId = '') {
      const symbol = getCardGraphic(c.value);
      const isSelected = selectedCards.includes(cardId) ? 'selected' : '';
      const rarityClass = c.rarity ? `rarity-${c.rarity}` : '';

      return `
        <div id="card-${cardId}" class="card ${c.color} ${isSelected} ${rarityClass}" style="z-index:${zIndex}; ${styleStr}" ${onClickAttr}>
          <div class="corner top-left">${symbol}</div>
          <div class="center-oval"><span class="center-number">${symbol}</span></div>
          <div class="corner bottom-right">${symbol}</div>
        </div>
      `;
    }

    socket.on('gameState', (data) => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      document.getElementById('currentTurn').innerText = data.currentTurn;
      document.getElementById('nextTurn').innerText = data.nextTurn;

      const stackBox = document.getElementById('stackIndicator');
      stackBox.innerText = data.stackedDraw > 0 ? `🔥 +${data.stackedDraw} STACKED!` : '';

      const domBox = document.getElementById('domainIndicator');
      domBox.innerText = data.domainColor ? `🌀 Domain: ${data.domainColor} (${data.domainTurns} turns left)` : '';

      const pileArea = document.getElementById('pileArea');
      const handOverlaysHTML = document.getElementById('handOverlays').outerHTML;
      pileArea.innerHTML = handOverlaysHTML +
        data.discardPile.map((c, i) => {
          const transformStr = `transform: translate(${c.offsetX}px, ${c.offsetY}px) rotate(${c.rot}deg);`;
          return createCardMarkup(c, i, transformStr);
        }).join('');

      const revDiv = document.getElementById('revealedHandsContainer');
      if (data.revealedPlayers && data.revealedPlayers.length > 0) {
        revDiv.innerHTML = data.revealedPlayers.map(rp => `
          <div style="background:rgba(255,0,0,0.2); padding:4px; margin:4px; border-radius:6px; font-size:12px;">
            👁️ Exposed Hand (${rp.name}): ${rp.cards.map(c => `[${c.color}${c.value}]`).join(' ')}
          </div>
        `).join('');
      } else {
        revDiv.innerHTML = '';
      }
    });

    socket.on('yourHand', (cards) => {
      currentHand = cards;
      selectedCards = selectedCards.filter(id => currentHand.some(c => c.id === id));
      updateHandDisplay();

      const handDiv = document.getElementById('hand');
      const total = cards.length;

      const overlapMargin = total > 5 ? Math.max(-45, -15 - (total * 2)) : -28;
      const maxRotate = Math.min(20, total * 2);

      handDiv.innerHTML = cards.map((c, idx) => {
        const angle = total > 1 ? ((idx - (total - 1) / 2) / ((total - 1) / 2)) * maxRotate : 0;
        const yOffset = Math.abs(angle) * 0.3;

        const styleStr = `margin-left: ${idx === 0 ? 0 : overlapMargin}px; transform: rotate(${angle}deg) translateY(${yOffset}px);`;
        const clickCode = `onclick="handleCardClick('${c.id}')"`;
        
        return createCardMarkup(c, idx, styleStr, clickCode, c.id);
      }).join('');
    });

    function sendChat() {
      const input = document.getElementById('chatInput');
      if (input.value.trim()) {
        socket.emit('sendChat', input.value.trim());
        input.value = '';
      }
    }

    socket.on('openDebugMenu', () => {
      document.getElementById('debugModal').classList.remove('hidden');
    });

    function closeDebugMenu() {
      document.getElementById('debugModal').classList.add('hidden');
    }

    function spawnDebugCard(color, value, rarity = null) {
      socket.emit('debugGiveCard', { color, value, rarity });
    }

    socket.on('chatMessage', (data) => {
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div><strong>${data.sender}:</strong> ${data.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    function sendEmoji(emoji) { socket.emit('sendEmoji', emoji); }

    socket.on('displayEmoji', (data) => {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.innerText = data.emoji;
      el.style.left = (Math.random() * 60 + 20) + 'vw';
      el.style.top = '65vh';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    });

    socket.on('gameOver', (finalLeaderboard) => {
      const isWinner = finalLeaderboard.length > 0 && finalLeaderboard[0].sessionId === sessionId;
      
      recordGameResult(isWinner);

      if (isWinner) {
        playSound('victory');
        triggerParticleExplosion(window.innerWidth / 2, window.innerHeight / 2, 60);
      } else {
        playSound('defeat');
      }

      alert("🎉 Game Over!\n\nRankings:\n" + finalLeaderboard.map((p, i) => `${i + 1}. ${p.name}`).join('\n'));
      goHome();
    });
  </script>
</body>
</html>
