<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UNO Party Deluxe</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-w: clamp(55px, 12vw, 80px);
      --card-h: calc(var(--card-w) * 1.46);
    }
    body.theme-wood { --bg-color: #2e1d0c; --panel-bg: #422b15; }
    body.theme-neon { --bg-color: #0d0221; --panel-bg: #190933; }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: var(--bg-color);
      color: #fff;
      margin: 0;
      padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .game-title { font-size: clamp(14px, 3.5vw, 20px); font-weight: bold; margin: 0; cursor: pointer; user-select: none; }
    .theme-picker { padding: 6px 10px; font-size: clamp(12px, 2.8vw, 14px); border-radius: 6px; background: #333; color: #fff; border: 1px solid #555; }

    input, button, select { padding: clamp(8px, 2vw, 12px); margin: 4px; font-size: clamp(13px, 3vw, 16px); border-radius: 8px; border: none; outline: none; }
    button { background-color: #28a745; color: white; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    button:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }

    .hidden { display: none !important; }

    .turn-bar { font-size: clamp(15px, 3.8vw, 20px); font-weight: bold; margin: 4px 0; }
    .timer-container { width: min(85%, 400px); background: #333; height: clamp(6px, 1.5vh, 10px); border-radius: 5px; margin: 4px auto 10px auto; overflow: hidden; }
    .timer-fill { width: 100%; height: 100%; background: #e74c3c; transition: width 1s linear; }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: clamp(5px, 1.2vw, 10px);
      border: clamp(2px, 0.4vw, 3px) solid #fff;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
      cursor: pointer;
      display: inline-block;
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.2s ease, border-color 0.2s ease;
      transform-origin: bottom center;
    }
    .card.selected { border: 4px solid #f1c40f !important; transform: translateY(-25px) scale(1.1) !important; z-index: 150 !important; }
    .card:hover { transform: translateY(-20px) scale(1.15); z-index: 100; }
    .card .corner { position: absolute; top: 2px; left: 4px; font-size: clamp(9px, 2vw, 12px); font-weight: bold; }
    .card .center-oval {
      width: 65%; height: 65%; background: white; border-radius: 50%;
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
      display: flex; align-items: center; justify-content: center;
    }
    .card .center-number { font-size: clamp(14px, 3.5vw, 22px); font-weight: 900; }

    .Red { background-color: #e74c3c; color: white; }
    .Red .center-number { color: #e74c3c; }
    .Blue { background-color: #2980b9; color: white; }
    .Blue .center-number { color: #2980b9; }
    .Green { background-color: #27ae60; color: white; }
    .Green .center-number { color: #27ae60; }
    .Yellow { background-color: #f1c40f; color: black; }
    .Yellow .center-number { color: #f1c40f; }
    .Wild { background: linear-gradient(135deg, #e74c3c, #2980b9, #27ae60, #f1c40f); color: white; }
    .Wild .center-number { color: #111; }

    .pile-area { position: relative; width: clamp(100px, 25vw, 140px); height: clamp(100px, 25vw, 140px); margin: 6px auto; display: flex; align-items: center; justify-content: center; }
    .pile-area .card { position: absolute; }
    .direction-arrow { position: absolute; width: 100%; height: 100%; border: 3px dashed #f1c40f; border-radius: 50%; pointer-events: none; transition: transform 0.5s ease; }
    .direction-arrow.reverse { transform: rotate(-180deg); border-color: #e74c3c; }

    .hand-container {
      display: flex; justify-content: center; align-items: flex-end;
      margin: 15px auto 10px auto; min-height: calc(var(--card-h) + 35px);
      width: 100%; max-width: 100vw; padding: 25px 15px 15px 15px;
      box-sizing: border-box; overflow-x: auto; overflow-y: visible;
    }

    .host-badge { background: #f39c12; color: #111; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; margin-left: 5px; }
    .kick-btn { background: #dc3545; font-size: 10px; padding: 2px 6px; margin-left: 8px; border-radius: 4px; cursor: pointer; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 300; }
    .modal-card { background: var(--panel-bg); padding: 16px; border-radius: 12px; width: min(90vw, 320px); max-height: 80vh; overflow-y: auto; text-align: left; }
    .lobby-item { background: #222; padding: 8px; margin: 6px 0; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }

    .chat-section { margin-top: auto; padding-top: 10px; padding-bottom: 5px; }
    .chat-box { background: rgba(0,0,0,0.6); width: min(90%, 400px); height: 70px; overflow-y: auto; margin: 0 auto 6px auto; border-radius: 6px; padding: 6px; text-align: left; font-size: 13px; }

    .floating-emoji {
      position: fixed; font-size: 45px; z-index: 999; pointer-events: none;
      animation: floatUp 2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      20% { opacity: 1; transform: translateY(-30px) scale(1.2); }
      80% { opacity: 1; transform: translateY(-120px) scale(1); }
      100% { opacity: 0; transform: translateY(-180px) scale(0.8); }
    }
  </style>
</head>
<body>

  <header>
    <div class="game-title" onclick="goHome()">🎴 Uno Game</div>
    <select class="theme-picker" onchange="changeTheme(this.value)">
      <option value="dark">🌙 Dark</option>
      <option value="wood">🪵 Wood</option>
      <option value="neon">⚡ Neon</option>
    </select>
  </header>

  <div id="loginScreen">
    <h2>Join Room</h2>
    
    <input type="text" id="username" placeholder="Your Name" /><br>

    <select id="avatarSelect" style="font-size: 20px; padding: 6px 12px; margin: 4px;">
      <option value="🤠">🤠</option>
      <option value="🤖">🤖</option>
      <option value="🦊">🦊</option>
      <option value="🥷">🥷</option>
      <option value="👑">👑</option>
      <option value="👽">👽</option>
      <option value="👾">👾</option>
      <option value="🦄">🦄</option>
      <option value="🦁">🦁</option>
      <option value="🐉">🐉</option>
      <option value="🐲">🐲</option>
      <option value="👻">👻</option>
      <option value="🐼">🐼</option>
      <option value="🐯">🐯</option>
      <option value="🧙‍♂️">🧙‍♂️</option>
      <option value="🚀">🚀</option>
      <option value="🔥">🔥</option>
      <option value="😎">😎</option>
      <option value="💀">💀</option>
      <option value="🤡">🤡</option>
      <option value="💩">💩</option>
      <option value="🐙">🐙</option>
      <option value="🦈">🦈</option>
      <option value="🦉">🦉</option>
      <option value="🐸">🐸</option>
      <option value="🍕">🍕</option>
      <option value="🍔">🍔</option>
      <option value="🥑">🥑</option>
      <option value="⚽">⚽</option>
      <option value="🎮">🎮</option>
      <option value="💎">💎</option>
    </select><br>

    <input type="text" id="roomCode" placeholder="Room Code" /><br>
    <input type="password" id="roomPassword" placeholder="Password (Optional)" /><br>

    <div style="margin: 6px 0; font-size: 14px;">
      <label><input type="checkbox" id="privateCheck"> Hide from Lobby Browser</label>
    </div>

    <button onclick="joinDirect()">Join / Create</button><br>
    <button onclick="openLobbyBrowser()" style="background-color: #17a2b8;">🌐 Browse Lobbies</button>
  </div>

  <div id="lobbyBrowserModal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3>Available Lobbies</h3>
      <div id="lobbyListContainer">Loading...</div>
      <button onclick="closeLobbyBrowser()" style="background-color: #6c757d; width: 100%;">Close</button>
    </div>
  </div>

  <div id="lobbyScreen" class="hidden">
    <h2 id="roomTitle"></h2>
    <h3 id="countdownDisplay" style="color:#f1c40f;"></h3>

    <button onclick="copyInviteLink()" style="background-color: #17a2b8; font-size: 12px; padding: 4px 10px;">📋 Copy Invite Link</button>

    <h3>Players:</h3>
    <ul id="playerList" style="list-style:none; padding:0; font-size: 18px;"></ul>

    <div id="hostControls">
      <button id="startBtn" onclick="requestStart()" style="background-color: #007bff;">Start Game</button>
    </div>
    <div id="guestWaitingMsg" class="waiting-msg hidden" style="font-style:italic; color:#f1c40f;">
      ⏳ Waiting for host to start the game...
    </div>
  </div>

  <div id="gameScreen" class="hidden" style="display: flex; flex-direction: column; flex-grow: 1;">
    <div class="turn-bar">
      Current: <span id="currentTurn" style="color:#2ecc71;">--</span><br>
      <small style="color:#aaa; font-size:13px;">Next: <span id="nextTurn">--</span></small>
      <div id="stackIndicator" style="color:#e74c3c; font-weight:bold; font-size:14px;"></div>
    </div>

    <div class="timer-container">
      <div id="timerFill" class="timer-fill"></div>
    </div>

    <div class="pile-area" id="pileArea">
      <div id="dirArrow" class="direction-arrow"></div>
    </div>

    <div>
      <button id="playSelectedBtn" onclick="submitSelectedCards()" style="background-color: #28a745;" class="hidden">Play Selected Stack</button>
      <button onclick="drawCard()" style="background-color: #e67e22;">Draw Card</button>
      <button id="unoBtn" onclick="callUno()" style="background-color: #e74c3c;">🚨 UNO!</button>
    </div>

    <div style="margin-top: 4px;">
      <button onclick="sendEmoji('😂')">😂</button>
      <button onclick="sendEmoji('🤬')">🤬</button>
      <button onclick="sendEmoji('💩')">💩</button>
      <button onclick="sendEmoji('⏱️')">⏱️</button>
    </div>

    <div id="hand" class="hand-container"></div>

    <div class="chat-section">
      <div class="chat-box" id="chatBox"></div>
      <input type="text" id="chatInput" placeholder="Send message..." onkeydown="if(event.key==='Enter') sendChat()"/>
    </div>
  </div>

  <div id="colorModal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">
      <h3>Select Color</h3>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 140px;">
        <button class="Red" onclick="selectWildColor('Red')">Red</button>
        <button class="Blue" onclick="selectWildColor('Blue')">Blue</button>
        <button class="Green" onclick="selectWildColor('Green')">Green</button>
        <button class="Yellow" onclick="selectWildColor('Yellow')">Yellow</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let isHost = false;
    let selectedCards = [];
    let currentHand = [];

    function goHome() {
      window.location.hash = '';
      location.reload();
    }

    function getUrlParams() {
      const hash = window.location.hash.substring(1);
      const parts = hash.split('?');
      const room = parts[0] || '';
      const params = new URLSearchParams(parts[1] || '');
      return { room, sessionId: params.get('session') };
    }

    const urlData = getUrlParams();
    let sessionId = urlData.sessionId || localStorage.getItem('uno_session_id');
    if (!sessionId) {
      sessionId = 'sess_' + Math.random().toString(36).substr(2, 9);
    }
    localStorage.setItem('uno_session_id', sessionId);

    function changeTheme(theme) {
      document.body.className = '';
      if (theme !== 'dark') document.body.classList.add('theme-' + theme);
    }

    function joinDirect() {
      let username = document.getElementById('username').value.trim();
      let roomCode = document.getElementById('roomCode').value.trim();
      const avatar = document.getElementById('avatarSelect').value;
      const isPrivate = document.getElementById('privateCheck').checked;
      const password = document.getElementById('roomPassword').value.trim();

      if (!roomCode) return alert("Please enter a room code!");

      localStorage.setItem('uno_username', username);
      localStorage.setItem('uno_avatar', avatar);
      window.location.hash = `${roomCode}?session=${sessionId}`;

      socket.emit('joinRoom', { username, roomCode, avatar, sessionId, isPrivate, password });

      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.remove('hidden');
      document.getElementById('roomTitle').innerText = "Room: " + roomCode;
    }

    function copyInviteLink() {
      const roomCode = document.getElementById('roomCode').value.trim() || urlData.room;
      const url = `${window.location.origin}/#${roomCode}`;
      navigator.clipboard.writeText(url).then(() => alert("Copied Invite Link!"));
    }

    window.addEventListener('load', () => {
      const savedName = localStorage.getItem('uno_username');
      const savedAvatar = localStorage.getItem('uno_avatar');

      if (savedName) document.getElementById('username').value = savedName;
      if (savedAvatar) document.getElementById('avatarSelect').value = savedAvatar;

      if (urlData.room) {
        document.getElementById('roomCode').value = urlData.room;
        joinDirect();
      }
    });

    function openLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.remove('hidden');
      socket.emit('getLobbies');
    }

    function closeLobbyBrowser() {
      document.getElementById('lobbyBrowserModal').classList.add('hidden');
    }

    socket.on('lobbyList', (lobbies) => {
      const container = document.getElementById('lobbyListContainer');
      if (lobbies.length === 0) {
        container.innerHTML = '<p style="color:#aaa;">No public lobbies found.</p>';
        return;
      }
      container.innerHTML = lobbies.map(l => `
        <div class="lobby-item">
          <div><strong>Room ${l.code}</strong> ${l.hasPassword ? '🔒' : ''} (${l.players}/12)</div>
          <button onclick="joinFromBrowser('${l.code}', ${l.hasPassword})">Join</button>
        </div>
      `).join('');
    });

    function joinFromBrowser(code, hasPassword) {
      document.getElementById('roomCode').value = code;
      if (hasPassword) {
        const pwd = prompt("Enter Room Password:");
        if (pwd === null) return;
        document.getElementById('roomPassword').value = pwd;
      }
      closeLobbyBrowser();
      joinDirect();
    }

    function requestStart() {
      if (isHost) socket.emit('requestStartGame');
    }

    function kickPlayer(targetSessionId) {
      if (isHost) socket.emit('kickPlayer', targetSessionId);
    }

    socket.on('kickedMsg', () => {
      alert("You were kicked from the lobby.");
      goHome();
    });

    function drawCard() { 
      selectedCards = [];
      updateHandDisplay();
      socket.emit('drawCard'); 
    }
    
    function callUno() { socket.emit('callUno'); }

    socket.on('unoAcknowledged', () => {
      const unoBtn = document.getElementById('unoBtn');
      unoBtn.style.backgroundColor = '#27ae60';
      setTimeout(() => unoBtn.style.backgroundColor = '#e74c3c', 2000);
    });

    function handleCardClick(cardId) {
      const clickedCard = currentHand.find(c => c.id === cardId);
      if (!clickedCard) return;

      const index = selectedCards.indexOf(cardId);
      if (index > -1) {
        selectedCards.splice(index, 1);
      } else {
        if (selectedCards.length > 0) {
          const firstSelected = currentHand.find(c => c.id === selectedCards[0]);
          if (firstSelected && firstSelected.value !== clickedCard.value) selectedCards = [cardId];
          else selectedCards.push(cardId);
        } else {
          selectedCards.push(cardId);
        }
      }
      updateHandDisplay();
    }

    function updateHandDisplay() {
      const btn = document.getElementById('playSelectedBtn');
      if (selectedCards.length > 0) {
        btn.classList.remove('hidden');
        btn.innerText = `Play Selected (${selectedCards.length})`;
      } else {
        btn.classList.add('hidden');
      }

      currentHand.forEach(c => {
        const el = document.getElementById(`card-${c.id}`);
        if (el) {
          if (selectedCards.includes(c.id)) el.classList.add('selected');
          else el.classList.remove('selected');
        }
      });
    }

    function submitSelectedCards() {
      if (selectedCards.length === 0) return;
      const lastCardId = selectedCards[selectedCards.length - 1];
      const lastCard = currentHand.find(c => c.id === lastCardId);

      if (lastCard && (lastCard.color === 'Wild' || selectedCards.length > 1)) {
        document.getElementById('colorModal').classList.remove('hidden');
      } else {
        socket.emit('playCards', { cardIds: selectedCards });
        selectedCards = [];
        updateHandDisplay();
      }
    }

    function selectWildColor(chosenColor) {
      document.getElementById('colorModal').classList.add('hidden');
      socket.emit('playCards', { cardIds: selectedCards, chosenColor });
      selectedCards = [];
      updateHandDisplay();
    }

    socket.on('startCountdown', (sec) => {
      document.getElementById('countdownDisplay').innerText = `Game starting in ${sec}...`;
      document.getElementById('hostControls').classList.add('hidden');
      document.getElementById('guestWaitingMsg').classList.add('hidden');
    });

    socket.on('errorMsg', (msg) => { alert(msg); goHome(); });

    socket.on('updateLobby', (data) => {
      isHost = (data.hostSessionId === sessionId);

      document.getElementById('playerList').innerHTML = data.players.map(p => `
        <li style="margin: 6px 0;">
          ${p.avatar} ${p.name}
          ${p.sessionId === data.hostSessionId ? '<span class="host-badge">HOST</span>' : ''}
          ${isHost && p.sessionId !== sessionId ? `<button class="kick-btn" onclick="kickPlayer('${p.sessionId}')">Kick</button>` : ''}
        </li>
      `).join('');

      if (isHost) {
        document.getElementById('hostControls').classList.remove('hidden');
        document.getElementById('guestWaitingMsg').classList.add('hidden');
      } else {
        document.getElementById('hostControls').classList.add('hidden');
        document.getElementById('guestWaitingMsg').classList.remove('hidden');
      }
    });

    socket.on('timerUpdate', (secondsLeft) => {
      document.getElementById('timerFill').style.width = ((secondsLeft / 30) * 100) + '%';
    });

    function getCardGraphic(val) {
      if (val === 'Reverse') return '⇄';
      if (val === 'Skip') return '⊘';
      return val;
    }

    function createCardMarkup(c, zIndex = 0, styleStr = '', onClickAttr = '', cardId = '') {
      const symbol = getCardGraphic(c.value);
      const isSelected = selectedCards.includes(cardId) ? 'selected' : '';
      return `
        <div id="card-${cardId}" class="card ${c.color} ${isSelected}" style="z-index:${zIndex}; ${styleStr}" ${onClickAttr}>
          <div class="corner">${symbol}</div>
          <div class="center-oval"><span class="center-number">${symbol}</span></div>
        </div>
      `;
    }

    socket.on('gameState', (data) => {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');

      document.getElementById('currentTurn').innerText = data.currentTurn;
      document.getElementById('nextTurn').innerText = data.nextTurn;

      const stackBox = document.getElementById('stackIndicator');
      stackBox.innerText = data.stackedDraw > 0 ? `🔥 +${data.stackedDraw} STACKED!` : '';

      const dirArrow = document.getElementById('dirArrow');
      if (data.direction === -1) dirArrow.classList.add('reverse');
      else dirArrow.classList.remove('reverse');

      const pileArea = document.getElementById('pileArea');
      pileArea.innerHTML = `<div id="dirArrow" class="${dirArrow.className}"></div>` + 
        data.discardPile.map((c, i) => {
          const transformStr = `transform: translate(${c.offsetX}px, ${c.offsetY}px) rotate(${c.rot}deg);`;
          return createCardMarkup(c, i, transformStr);
        }).join('');
    });

    socket.on('yourHand', (cards) => {
      currentHand = cards;
      selectedCards = selectedCards.filter(id => currentHand.some(c => c.id === id));
      updateHandDisplay();

      const handDiv = document.getElementById('hand');
      const total = cards.length;

      const overlapMargin = total > 5 ? Math.max(-45, -15 - (total * 2)) : -28;
      const maxRotate = Math.min(20, total * 2);

      handDiv.innerHTML = cards.map((c, idx) => {
        const angle = total > 1 ? ((idx - (total - 1) / 2) / ((total - 1) / 2)) * maxRotate : 0;
        const yOffset = Math.abs(angle) * 0.3;

        const styleStr = `margin-left: ${idx === 0 ? 0 : overlapMargin}px; transform: rotate(${angle}deg) translateY(${yOffset}px);`;
        const clickCode = `onclick="handleCardClick('${c.id}')"`;
        
        return createCardMarkup(c, idx, styleStr, clickCode, c.id);
      }).join('');
    });

    function sendChat() {
      const input = document.getElementById('chatInput');
      if (input.value.trim()) {
        socket.emit('sendChat', input.value.trim());
        input.value = '';
      }
    }

    socket.on('chatMessage', (data) => {
      const box = document.getElementById('chatBox');
      box.innerHTML += `<div><strong>${data.sender}:</strong> ${data.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });

    function sendEmoji(emoji) { socket.emit('sendEmoji', emoji); }

    socket.on('displayEmoji', (data) => {
      const el = document.createElement('div');
      el.className = 'floating-emoji';
      el.innerText = data.emoji;
      el.style.left = (Math.random() * 60 + 20) + 'vw';
      el.style.top = '65vh';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    });

    socket.on('gameOver', (finalLeaderboard) => {
      alert("🎉 Game Over!\n\nRankings:\n" + finalLeaderboard.map((p, i) => `${i + 1}. ${p}`).join('\n'));
      goHome();
    });
  </script>
</body>
</html>
